<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D7001D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrôle CAH5">
<meta name="robots" content="noindex,nofollow">
<title>MINISO · Chemin de contrôle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="dot-badge" id="menuBadge" hidden></span>
    </button>
    <div class="wordmark" aria-label="MINISO">
      <span class="wm">MINISO</span>
      <span class="wm-sub" id="subTitle">Chemin de contrôle</span>
    </div>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-act="closeMenu"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="drawer-head">
      <div class="wordmark"><span class="wm">MINISO</span><span class="wm-sub" id="drawerStore"></span></div>
      <button class="round-x" data-act="closeMenu" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="drawerBody"></div>
  </aside>
</div>

<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
